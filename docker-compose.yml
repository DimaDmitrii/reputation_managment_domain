services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Waiting for Kafka...';

      until /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --list > /dev/null 2>&1;
      do
        sleep 2;
      done;

      echo 'Kafka is ready';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create
      --if-not-exists
      --topic review.created
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create
      --if-not-exists
      --topic media.uploaded
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create
      --if-not-exists
      --topic media.processed
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create
      --if-not-exists
      --topic moderation.completed
      --partitions 3
      --replication-factor 1;

      echo 'Kafka topics created';
      "


  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka


  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d


  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data


  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD};
      do
        sleep 2;
      done;
      mc mb --ignore-existing local/review-media;
      exit 0;
      "


  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  review-service:
    build:
      context: ./services/review-service
    container_name: review-service
    ports:
      - "8001:8001"


  media-service:
    build:
      context: ./services/media-service
    container_name: media-service
    ports:
      - "8002:8002"


  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      REVIEW_SERVICE_URL: http://review-service:8001
      MEDIA_SERVICE_URL: http://media-service:8002
    depends_on:
      - review-service
      - media-service


volumes:
  kafka_data:
  postgres_data:
  minio_data:
  redis_data:
